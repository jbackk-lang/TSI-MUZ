<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUZ Demo 1.3</title><style>
:root{font:16px system-ui;color:#142f42;background:#eef3f8}
*{box-sizing:border-box}main{max-width:760px;margin:7vh auto;padding:24px}
article{background:white;border:1px solid #b9ccdb;border-radius:14px;padding:24px}
h1{margin:0 0 10px;font-size:30px}h2{font-size:19px}
nav,form{display:flex;flex-wrap:wrap;gap:9px;align-items:end}
label{display:grid;gap:4px}button,input{font:inherit;padding:9px;border-radius:7px;border:1px solid #8aa7bc}
button{background:#155e99;color:white;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #155e99;outline-offset:2px}
output{display:block;white-space:pre-line;margin-top:16px;padding:12px;background:#eef6fc;border-left:4px solid #155e99;min-height:42px}
table{width:100%;border-collapse:collapse;margin-top:14px}td,th{border-bottom:1px solid #d3e2ea;padding:8px;text-align:left}
</style><main><article><h1>MUZ Demo 1.3</h1><h2>Budżet na przykładowych danych</h2><p>Wpisz nazwę wydatku lub kwotę, np. 145,50. Podsumowanie dotyczy widocznych pozycji.</p><form id="form"><label>Filtr<input id="query" type="search" placeholder="Nazwa lub kwota"></label><button>Szukaj</button></form><table><thead><tr><th>Wydatek</th><th>Kwota</th></tr></thead><tbody></tbody></table><output id="out" aria-live="polite"></output></article></main><script>const rows=[['Zakupy spożywcze',14550],['Komunikacja',4200],['Internet',6900]];const fmt=n=>new Intl.NumberFormat('pl',{style:'currency',currency:'PLN'}).format(n/100);function render(){const q=document.getElementById('query').value.trim().toLowerCase().replace('.',',');const visible=rows.filter(([n,c])=>!q||n.toLowerCase().includes(q)||fmt(c).includes(q));const body=document.querySelector('tbody');body.replaceChildren();for(const [n,c] of visible){const tr=body.insertRow();tr.insertCell().textContent=n;tr.insertCell().textContent=fmt(c);}document.getElementById('out').textContent='Suma: '+fmt(visible.reduce((total,[,c])=>total+c,0));}document.getElementById('form').onsubmit=e=>{e.preventDefault();render();};render();</script></html>
